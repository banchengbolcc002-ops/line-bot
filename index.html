<section class="hero"><div class="eyebrow">A LITTLE MOMENT OF GRACE</div><h1>把今天的祝福<br>親手刮開</h1><p>安靜片刻，領受一段經文與一份禱告</p><div class="ornament" aria-hidden="true">✦</div></section>
<section class="main-card" aria-label="祝福刮刮卡"><div class="card-frame"><div class="card-kicker">BANCHENG · BLESSING CARD</div><div class="scratch-zone" id="scratchZone"><div class="blessing-content" aria-live="polite"><div class="blessing-label">今日祝福 · <span id="cardNumber">01</span></div><h2 class="blessing-title" id="blessingTitle"></h2><div class="verse-ref" id="verseRef"></div><p class="verse-text" id="verseText"></p><p class="prayer" id="prayerText"></p><div class="amen">願主賜你平安 · 阿們</div></div><canvas id="scratch" aria-label="刮開卡片以閱讀祝福"></canvas><div class="scratch-hint"><div class="hint-icon">✧</div><strong>輕輕刮開祝福</strong><span>以手指或滑鼠在卡片上滑動</span></div></div><div class="card-bottom"><span>願恩典與你同在</span><span>✦　✦　✦</span></div></div></section>

const blessings=[
{title:"在需要中得供應",ref:"腓立比書 4:19",verse:"我的　神必照他榮耀的豐富，在基督耶穌裡，使你們一切所需用的都充足。",prayer:"親愛的天父，求祢看顧我今天所面對的需要，賜我信心一步一步前行，也使我記得祢的恩典常與我同在。阿們。"},
{title:"在忙碌中得安穩",ref:"詩篇 46:10",verse:"你們要休息，要知道我是　神！我必在外邦中被尊崇，在遍地上也被尊崇。",prayer:"親愛的主，求祢使我的心安靜下來，在忙碌與變動中仍能仰望祢。求祢帶領我走好今天的每一步。阿們。"},
{title:"領受新的盼望",ref:"耶利米哀歌 3:22–23",verse:"我們不至消滅，是出於耶和華諸般的慈愛；是因他的憐憫不至斷絕。每早晨，這都是新的；你的誠實極其廣大！",prayer:"親愛的天父，謝謝祢每天以慈愛扶持我。當我感到疲倦時，求祢重新堅固我，使我帶著盼望迎向新的一天。阿們。"},
{title:"在困難中有勇氣",ref:"約書亞記 1:9",verse:"我豈沒有吩咐你嗎？你當剛強壯膽！不要懼怕，也不要驚惶，因為你無論往哪裡去，耶和華你的　神必與你同在。",prayer:"主啊，求祢陪伴我面對眼前的挑戰，賜我勇氣和智慧，也提醒我不必獨自承擔，因祢始終看顧我。阿們。"},
{title:"讓愛流進家庭",ref:"歌羅西書 3:14",verse:"在這一切之外，要存著愛心，愛心就是聯絡全德的。",prayer:"親愛的主，求祢把溫柔與耐心放在我們家中，使我們願意傾聽、彼此饒恕，在日常相處裡活出祢的愛。阿們。"},
{title:"在選擇中得引導",ref:"箴言 3:5–6",verse:"你要專心仰賴耶和華，不可倚靠自己的聰明，在你一切所行的事上都要認定他，他必指引你的路。",prayer:"天父，當我需要作決定時，求祢賜我清明的心和合宜的建議，帶領我走在正直、良善的道路上。阿們。"},
{title:"領受身心的安歇",ref:"馬太福音 11:28",verse:"凡勞苦擔重擔的人可以到我這裡來，我就使你們得安息。",prayer:"主耶穌，求祢接住我的疲憊，使我在祢裡面重新得力。求祢幫助我好好休息，也有力量完成今天當做的事。阿們。"},
{title:"成為和平的使者",ref:"馬太福音 5:9",verse:"使人和睦的人有福了！因為他們必稱為　神的兒子。",prayer:"親愛的天父，求祢使我先領受祢所賜的平安，也幫助我用溫和、誠實的話語與人相處，成為身邊人的祝福。阿們。"},
{title:"感謝每天的恩典",ref:"帖撒羅尼迦前書 5:18",verse:"凡事謝恩；因為這是　神在基督耶穌裡向你們所定的旨意。",prayer:"主啊，求祢開啟我的眼睛，看見生活中值得感謝的小事。即使環境不容易，也求祢保守我的心，記念祢一路的恩典。阿們。"},
{title:"在愛中彼此扶持",ref:"加拉太書 6:2",verse:"你們各人的重擔要互相擔當，如此，就完全了基督的律法。",prayer:"天父，求祢讓我看見身旁需要關懷的人，賜我合宜的話語和行動，使我能用愛陪伴、扶持有需要的家人與朋友。阿們。"},
{title:"為明天存盼望",ref:"羅馬書 15:13",verse:"但願使人有盼望的　神，因信將諸般的喜樂、平安充滿你們的心，使你們藉著聖靈的能力大有盼望！",prayer:"賜盼望的神，求祢以喜樂和平安充滿我的心，使我在等待中仍有盼望，在每個新的開始都經歷祢的同在。阿們。"},
{title:"用恩慈回應他人",ref:"以弗所書 4:32",verse:"並要以恩慈相待，存憐憫的心，彼此饒恕，正如　神在基督裡饒恕了你們一樣。",prayer:"親愛的主，求祢使我記得自己也蒙了恩典，幫助我以恩慈待人，在誤解與衝突中仍願意尋求理解與和好。阿們。"},{title:"在懼怕中得力量",ref:"以賽亞書 41:10",verse:"你不要害怕，因為我與你同在；不要驚惶，因為我是你的　神。我必堅固你，我必幫助你；我必用我公義的右手扶持你。",prayer:"親愛的主，當我感到不安時，求祢提醒我祢與我同在。賜我勇氣面對眼前的事，也扶持我走過困難。阿們。"},
{title:"在牧者懷中得安慰",ref:"詩篇 23:1",verse:"耶和華是我的牧者，我必不至缺乏。",prayer:"主啊，謝謝祢像牧者看顧羊群一樣看顧我。求祢帶領我今天的腳步，使我在需要中經歷祢的供應。阿們。"},
{title:"把憂慮交給今天",ref:"馬太福音 6:34",verse:"所以，不要為明天憂慮，因為明天自有明天的憂慮；一天的難處一天當就夠了。",prayer:"親愛的天父，求祢幫助我放下對明天的擔心，專心走好今天的路。求祢賜我所需的智慧、力量與平安。阿們。"},
{title:"記得幫助從祢而來",ref:"詩篇 121:1–2",verse:"我要向山舉目；我的幫助從何而來？我的幫助從造天地的耶和華而來。",prayer:"主啊，當我不知道該往哪裡走時，求祢引導我仰望祢。謝謝祢是我的幫助，求祢陪伴我走過今天。阿們。"},
{title:"在禱告中領受平安",ref:"腓立比書 4:6–7",verse:"應當一無掛慮，只要凡事藉著禱告、祈求，和感謝，將你們所要的告訴　神。神所賜、出人意外的平安，必在基督耶穌裡保守你們的心懷意念。",prayer:"親愛的主，我把心中的掛慮交在祢手中。求祢保守我的心思意念，使我在禱告中領受從祢而來的平安。阿們。"},
{title:"疲倦時重新得力",ref:"以賽亞書 40:31",verse:"但那等候耶和華的必重新得力。他們必如鷹展翅上騰；他們奔跑卻不困倦，行走卻不疲乏。",prayer:"天父，當我疲憊或失去力量時，求祢更新我的心，使我在等候中重新得力，也有盼望繼續前行。阿們。"},
{title:"領受主所賜的平安",ref:"約翰福音 14:27",verse:"我留下平安給你們；我將我的平安賜給你們。我所賜的，不像世人所賜的。你們心裡不要憂愁，也不要膽怯。",prayer:"主耶穌，求祢把平安放在我心裡，陪伴我面對不確定的事。求祢除去我的憂愁，使我勇敢信靠祢。阿們。"},
{title:"相信祢仍在工作",ref:"羅馬書 8:28",verse:"我們曉得萬事都互相效力，叫愛　神的人得益處，就是按他旨意被召的人。",prayer:"親愛的天父，求祢幫助我在不明白的時候仍信靠祢。求祢帶領我看見祢的工作，使我持守盼望和良善。阿們。"},
{title:"在傷心時得著陪伴",ref:"詩篇 34:18",verse:"耶和華靠近傷心的人，拯救靈性痛悔的人。",prayer:"主啊，求祢親近正在傷心或受挫的我，安慰我的心，讓我知道自己沒有被遺忘，也能一步一步重新站立。阿們。"},
{title:"把計畫交託給主",ref:"箴言 16:3",verse:"你所做的，要交託耶和華，你所謀的，就必成立。",prayer:"天父，我把手上的工作和心中的計畫交給祢。求祢賜我合宜的方向，也幫助我忠心做好今天該做的事。阿們。"},
{title:"前行時不孤單",ref:"申命記 31:8",verse:"耶和華必在你前面行；他必與你同在，必不撇下你，也不丟棄你。不要懼怕，也不要驚惶。",prayer:"親愛的主，謝謝祢走在我前面，也在我身旁。求祢除去我的懼怕，使我記得無論走到哪裡，祢都與我同在。阿們。"},
{title:"把道路交在主手中",ref:"詩篇 37:5",verse:"當將你的事交託耶和華，並倚靠他，他就必成全。",prayer:"主啊，我把今天的責任、選擇與盼望都交託給祢。求祢引導我的腳步，賜我耐心信靠，並按祢的心意成就美好。阿們。"}
,
{title:"在主裡領受安穩",ref:"詩篇 4:8",verse:"我必安然躺下睡覺， 因為獨有你－耶和華使我安然居住。",prayer:"親愛的天父，求祢用這段話堅固我的心。求祢帶領我今天的腳步，在每件事上經歷祢的同在。阿們。"},
{title:"在主裡領受盼望",ref:"詩篇 16:8",verse:"我將耶和華常擺在我面前， 因他在我右邊，我便不致搖動。",prayer:"主啊，謝謝祢的話成為我的亮光。求祢賜我所需的智慧與力量，使我帶著信心走過今天。阿們。"},
{title:"在主裡領受勇氣",ref:"詩篇 19:14",verse:"耶和華－我的磐石，我的救贖主啊， 願我口中的言語、心裏的意念在你面前蒙悅納。",prayer:"親愛的主，求祢安慰我心中的憂慮，幫助我把重擔交給祢，並以祢所賜的平安保守我。阿們。"},
{title:"在主裡領受喜樂",ref:"詩篇 27:1",verse:"大衛的詩。 耶和華是我的亮光，是我的拯救， 我還怕誰呢？ 耶和華是我性命的保障， 我還懼誰呢？",prayer:"天父，求祢幫助我把祢的話藏在心裡，在順境與困難中都學習倚靠祢，活出愛與盼望。阿們。"},
{title:"在主裡領受引導",ref:"詩篇 29:11",verse:"耶和華必賜力量給他的百姓； 耶和華必賜平安的福給他的百姓。",prayer:"主耶穌，求祢更新我的心，使我在疲倦時重新得力，在迷惘時看見方向，知道祢一直與我同行。阿們。"},
{title:"在主裡領受恩典",ref:"詩篇 31:24",verse:"凡仰望耶和華的人， 你們都要壯膽，堅固你們的心！",prayer:"慈愛的天父，求祢看顧我和所愛的人，賜下健康、和睦與日用所需，也使我們成為別人的祝福。阿們。"},
{title:"在主裡領受平安",ref:"詩篇 32:8",verse:"我要教導你，指示你當行的路； 我要定睛在你身上勸戒你。",prayer:"主啊，求祢賜我謙卑受教的心，在今天的選擇中尋求祢的心意，並勇敢行出祢喜悅的道路。阿們。"},
{title:"在主裡領受信心",ref:"詩篇 37:4",verse:"又要以耶和華為樂， 他就將你心裏所求的賜給你。",prayer:"親愛的神，感謝祢不離不棄的愛。求祢幫助我放下懼怕，以感恩的心迎接新的開始。阿們。"},
{title:"在主裡領受更新",ref:"詩篇 40:1",verse:"大衛的詩，交與伶長。 我曾耐性等候耶和華； 他垂聽我的呼求。",prayer:"親愛的天父，求祢用這段話堅固我的心。求祢帶領我今天的腳步，在每件事上經歷祢的同在。阿們。"},
{title:"在主裡領受扶持",ref:"詩篇 42:11",verse:"我的心哪，你為何憂悶？ 為何在我裏面煩躁？ 應當仰望上帝，因我還要稱讚他。 他是我臉上的光榮，是我的上帝。",prayer:"主啊，謝謝祢的話成為我的亮光。求祢賜我所需的智慧與力量，使我帶著信心走過今天。阿們。"},
{title:"在主裡領受慈愛",ref:"詩篇 55:22",verse:"你要把你的重擔卸給耶和華， 他必撫養你； 他永不叫義人動搖。",prayer:"親愛的主，求祢安慰我心中的憂慮，幫助我把重擔交給祢，並以祢所賜的平安保守我。阿們。"},
{title:"在主裡領受力量",ref:"詩篇 56:3",verse:"我懼怕的時候要倚靠你。",prayer:"天父，求祢幫助我把祢的話藏在心裡，在順境與困難中都學習倚靠祢，活出愛與盼望。阿們。"},
{title:"在主裡領受安穩",ref:"詩篇 62:1",verse:"大衛的詩，照耶杜頓的作法，交與伶長。 我的心默默無聲，專等候上帝； 我的救恩是從他[而來]。",prayer:"主耶穌，求祢更新我的心，使我在疲倦時重新得力，在迷惘時看見方向，知道祢一直與我同行。阿們。"},
{title:"在主裡領受盼望",ref:"詩篇 63:3",verse:"因你的慈愛比生命更好， 我的嘴唇要頌讚你。",prayer:"慈愛的天父，求祢看顧我和所愛的人，賜下健康、和睦與日用所需，也使我們成為別人的祝福。阿們。"},
{title:"在主裡領受勇氣",ref:"詩篇 71:5",verse:"主－耶和華啊，你是我所盼望的； 從我年幼，你是我所倚靠的。",prayer:"主啊，求祢賜我謙卑受教的心，在今天的選擇中尋求祢的心意，並勇敢行出祢喜悅的道路。阿們。"},
{title:"在主裡領受喜樂",ref:"詩篇 73:26",verse:"我的肉體和我的心腸衰殘； 但上帝是我心裏的力量， 又是我的福分，直到永遠。",prayer:"親愛的神，感謝祢不離不棄的愛。求祢幫助我放下懼怕，以感恩的心迎接新的開始。阿們。"},
{title:"在主裡領受引導",ref:"詩篇 84:11",verse:"因為耶和華－上帝是日頭，是盾牌， 要賜下恩惠和榮耀。 他未嘗留下一樣好處不給那些行動正直的人。",prayer:"親愛的天父，求祢用這段話堅固我的心。求祢帶領我今天的腳步，在每件事上經歷祢的同在。阿們。"},
{title:"在主裡領受恩典",ref:"詩篇 86:5",verse:"主啊，你本為良善，樂意饒恕人， 有豐盛的慈愛賜給凡求告你的人。",prayer:"主啊，謝謝祢的話成為我的亮光。求祢賜我所需的智慧與力量，使我帶著信心走過今天。阿們。"},
{title:"在主裡領受平安",ref:"詩篇 91:1",verse:"住在至高者隱密處的， 必住在全能者的蔭下。",prayer:"親愛的主，求祢安慰我心中的憂慮，幫助我把重擔交給祢，並以祢所賜的平安保守我。阿們。"},
{title:"在主裡領受信心",ref:"詩篇 91:4",verse:"他必用自己的翎毛遮蔽你； 你要投靠在他的翅膀底下； 他的誠實是大小的盾牌。",prayer:"天父，求祢幫助我把祢的話藏在心裡，在順境與困難中都學習倚靠祢，活出愛與盼望。阿們。"},
{title:"在主裡領受更新",ref:"詩篇 100:5",verse:"因為耶和華本為善。 他的慈愛存到永遠； 他的信實直到萬代。",prayer:"主耶穌，求祢更新我的心，使我在疲倦時重新得力，在迷惘時看見方向，知道祢一直與我同行。阿們。"},
{title:"在主裡領受扶持",ref:"詩篇 103:2",verse:"我的心哪，你要稱頌耶和華！ 不可忘記他的一切恩惠！",prayer:"慈愛的天父，求祢看顧我和所愛的人，賜下健康、和睦與日用所需，也使我們成為別人的祝福。阿們。"},
{title:"在主裡領受慈愛",ref:"詩篇 107:1",verse:"你們要稱謝耶和華，因他本為善； 他的慈愛永遠長存！",prayer:"主啊，求祢賜我謙卑受教的心，在今天的選擇中尋求祢的心意，並勇敢行出祢喜悅的道路。阿們。"},
{title:"在主裡領受力量",ref:"詩篇 118:24",verse:"這是耶和華所定的日子， 我們在其中要高興歡喜！",prayer:"親愛的神，感謝祢不離不棄的愛。求祢幫助我放下懼怕，以感恩的心迎接新的開始。阿們。"},
{title:"在主裡領受安穩",ref:"詩篇 119:105",verse:"你的話是我腳前的燈， 是我路上的光。",prayer:"親愛的天父，求祢用這段話堅固我的心。求祢帶領我今天的腳步，在每件事上經歷祢的同在。阿們。"},
{title:"在主裡領受盼望",ref:"詩篇 126:5",verse:"流淚撒種的， 必歡呼收割！",prayer:"主啊，謝謝祢的話成為我的亮光。求祢賜我所需的智慧與力量，使我帶著信心走過今天。阿們。"},
{title:"在主裡領受勇氣",ref:"詩篇 139:14",verse:"我要稱謝你，因我受造，奇妙可畏； 你的作為奇妙，這是我心深知道的。",prayer:"親愛的主，求祢安慰我心中的憂慮，幫助我把重擔交給祢，並以祢所賜的平安保守我。阿們。"},
{title:"在主裡領受喜樂",ref:"詩篇 143:8",verse:"求你使我清晨得聽你慈愛[之言]， 因我倚靠你； 求你使我知道當行的路， 因我的心仰望你。",prayer:"天父，求祢幫助我把祢的話藏在心裡，在順境與困難中都學習倚靠祢，活出愛與盼望。阿們。"},
{title:"在主裡領受引導",ref:"箴言 3:24",verse:"你躺下，必不懼怕； 你躺臥，睡得香甜。",prayer:"主耶穌，求祢更新我的心，使我在疲倦時重新得力，在迷惘時看見方向，知道祢一直與我同行。阿們。"},
{title:"在主裡領受恩典",ref:"箴言 4:23",verse:"你要保守你心，勝過保守一切， 因為一生的果效是由心發出。",prayer:"慈愛的天父，求祢看顧我和所愛的人，賜下健康、和睦與日用所需，也使我們成為別人的祝福。阿們。"},
{title:"在主裡領受平安",ref:"箴言 10:12",verse:"恨能挑啟爭端； 愛能遮掩一切過錯。",prayer:"主啊，求祢賜我謙卑受教的心，在今天的選擇中尋求祢的心意，並勇敢行出祢喜悅的道路。阿們。"},
{title:"在主裡領受信心",ref:"箴言 15:1",verse:"回答柔和，使怒消退； 言語暴戾，觸動怒氣。",prayer:"親愛的神，感謝祢不離不棄的愛。求祢幫助我放下懼怕，以感恩的心迎接新的開始。阿們。"},
{title:"在主裡領受更新",ref:"箴言 16:9",verse:"人心籌算自己的道路； 惟耶和華指引他的腳步。",prayer:"親愛的天父，求祢用這段話堅固我的心。求祢帶領我今天的腳步，在每件事上經歷祢的同在。阿們。"},
{title:"在主裡領受扶持",ref:"箴言 17:17",verse:"朋友乃時常親愛， 弟兄為患難而生。",prayer:"主啊，謝謝祢的話成為我的亮光。求祢賜我所需的智慧與力量，使我帶著信心走過今天。阿們。"},
{title:"在主裡領受慈愛",ref:"箴言 18:10",verse:"耶和華的名是堅固臺； 義人奔入便得安穩。",prayer:"親愛的主，求祢安慰我心中的憂慮，幫助我把重擔交給祢，並以祢所賜的平安保守我。阿們。"},
{title:"在主裡領受力量",ref:"箴言 18:24",verse:"濫交朋友的，自取敗壞； 但有一朋友比弟兄更親密。",prayer:"天父，求祢幫助我把祢的話藏在心裡，在順境與困難中都學習倚靠祢，活出愛與盼望。阿們。"},
{title:"在主裡領受安穩",ref:"箴言 19:21",verse:"人心多有計謀； 惟有耶和華的籌算才能立定。",prayer:"主耶穌，求祢更新我的心，使我在疲倦時重新得力，在迷惘時看見方向，知道祢一直與我同行。阿們。"},
{title:"在主裡領受盼望",ref:"箴言 27:1",verse:"不要為明日自誇， 因為一日要生何事，你尚且不能知道。",prayer:"慈愛的天父，求祢看顧我和所愛的人，賜下健康、和睦與日用所需，也使我們成為別人的祝福。阿們。"},
{title:"在主裡領受勇氣",ref:"以賽亞書 26:3",verse:"堅心倚賴[你的]， 你必保守他十分平安， 因為他倚靠你。",prayer:"主啊，求祢賜我謙卑受教的心，在今天的選擇中尋求祢的心意，並勇敢行出祢喜悅的道路。阿們。"},
{title:"在主裡領受喜樂",ref:"以賽亞書 30:15",verse:"主耶和華－以色列的聖者曾如此說： 你們得救在乎歸回安息； 你們得力在乎平靜安穩； 你們竟自不肯。",prayer:"親愛的神，感謝祢不離不棄的愛。求祢幫助我放下懼怕，以感恩的心迎接新的開始。阿們。"},
{title:"在主裡領受引導",ref:"以賽亞書 43:2",verse:"你從水中經過，我必與你同在； 你詵過江河，水必不漫過你； 你從火中行過，必不被燒， 火焰也不着在你身上。",prayer:"親愛的天父，求祢用這段話堅固我的心。求祢帶領我今天的腳步，在每件事上經歷祢的同在。阿們。"},
{title:"在主裡領受恩典",ref:"以賽亞書 49:15",verse:"婦人焉能忘記她吃奶的嬰孩， 不憐恤她所生的兒子？ 即或有忘記的， 我卻不忘記你。",prayer:"主啊，謝謝祢的話成為我的亮光。求祢賜我所需的智慧與力量，使我帶著信心走過今天。阿們。"},
{title:"在主裡領受平安",ref:"以賽亞書 54:10",verse:"大山可以挪開， 小山可以遷移； 但我的慈愛必不離開你； 我平安的約也不遷移。 這是憐恤你的耶和華說的。",prayer:"親愛的主，求祢安慰我心中的憂慮，幫助我把重擔交給祢，並以祢所賜的平安保守我。阿們。"},
{title:"在主裡領受信心",ref:"耶利米書 31:3",verse:"古時耶和華向以色列顯現，[說]： 我以永遠的愛愛你， 因此我以慈愛吸引你。",prayer:"天父，求祢幫助我把祢的話藏在心裡，在順境與困難中都學習倚靠祢，活出愛與盼望。阿們。"},
{title:"在主裡領受更新",ref:"彌迦書 6:8",verse:"世人哪，耶和華已指示你何為善。 他向你所要的是甚麼呢？ 只要你行公義，好憐憫， 存謙卑的心，與你的上帝同行。",prayer:"主耶穌，求祢更新我的心，使我在疲倦時重新得力，在迷惘時看見方向，知道祢一直與我同行。阿們。"},
{title:"在主裡領受扶持",ref:"西番雅書 3:17",verse:"耶和華－你的上帝是施行拯救、 大有能力的[主]。 他在你中間必因你歡欣喜樂， 默然愛你，且因你喜樂而歡呼。",prayer:"慈愛的天父，求祢看顧我和所愛的人，賜下健康、和睦與日用所需，也使我們成為別人的祝福。阿們。"},

{title:"在主裡領受力量",ref:"馬太福音 5:6",verse:"飢渴慕義的人有福了！ 因為他們必得飽足。",prayer:"親愛的神，感謝祢不離不棄的愛。求祢幫助我放下懼怕，以感恩的心迎接新的開始。阿們。"},
{title:"在主裡領受安穩",ref:"馬太福音 6:26",verse:"你們看那天上的飛鳥，也不種，也不收，也不積蓄在倉裏，你們的天父尚且養活牠。你們不比飛鳥貴重得多嗎？",prayer:"親愛的天父，求祢用這段話堅固我的心。求祢帶領我今天的腳步，在每件事上經歷祢的同在。阿們。"},
{title:"在主裡領受盼望",ref:"馬太福音 6:33",verse:"你們要先求他的國和他的義，這些東西都要加給你們了。",prayer:"主啊，謝謝祢的話成為我的亮光。求祢賜我所需的智慧與力量，使我帶著信心走過今天。阿們。"},
{title:"在主裡領受勇氣",ref:"馬太福音 7:7",verse:"「你們祈求，就給你們；尋找，就尋見；叩門，就給你們開門。",prayer:"親愛的主，求祢安慰我心中的憂慮，幫助我把重擔交給祢，並以祢所賜的平安保守我。阿們。"},
{title:"在主裡領受喜樂",ref:"馬太福音 19:26",verse:"耶穌看着他們，說：「在人這是不能的，在上帝凡事都能。」",prayer:"天父，求祢幫助我把祢的話藏在心裡，在順境與困難中都學習倚靠祢，活出愛與盼望。阿們。"},
{title:"在主裡領受引導",ref:"馬可福音 10:27",verse:"耶穌看着他們，說：「在人是不能，在上帝卻不然，因為上帝凡事都能。」",prayer:"主耶穌，求祢更新我的心，使我在疲倦時重新得力，在迷惘時看見方向，知道祢一直與我同行。阿們。"},

{title:"在主裡領受平安",ref:"約翰福音 1:5",verse:"光照在黑暗裏，黑暗卻不接受光。",prayer:"主啊，求祢賜我謙卑受教的心，在今天的選擇中尋求祢的心意，並勇敢行出祢喜悅的道路。阿們。"},
{title:"在主裡領受信心",ref:"約翰福音 8:12",verse:"耶穌又對眾人說：「我是世界的光。跟從我的，就不在黑暗裏走，必要得着生命的光。」",prayer:"親愛的神，感謝祢不離不棄的愛。求祢幫助我放下懼怕，以感恩的心迎接新的開始。阿們。"},
{title:"在主裡領受更新",ref:"約翰福音 10:10",verse:"盜賊來，無非要偷竊，殺害，毀壞；我來了，是要叫羊得生命，並且得的更豐盛。",prayer:"親愛的天父，求祢用這段話堅固我的心。求祢帶領我今天的腳步，在每件事上經歷祢的同在。阿們。"},
{title:"在主裡領受扶持",ref:"約翰福音 15:5",verse:"我是葡萄樹，你們是枝子。常在我裏面的，我也常在他裏面，這人就多結果子；因為離了我，你們就不能做甚麼。",prayer:"主啊，謝謝祢的話成為我的亮光。求祢賜我所需的智慧與力量，使我帶著信心走過今天。阿們。"},
{title:"在主裡領受慈愛",ref:"約翰福音 15:9",verse:"我愛你們，正如父愛我一樣；你們要常在我的愛裏。",prayer:"親愛的主，求祢安慰我心中的憂慮，幫助我把重擔交給祢，並以祢所賜的平安保守我。阿們。"},
{title:"在主裡領受力量",ref:"約翰福音 16:33",verse:"我將這些事告訴你們，是要叫你們在我裏面有平安。在世上，你們有苦難；但你們可以放心，我已經勝了世界。」",prayer:"天父，求祢幫助我把祢的話藏在心裡，在順境與困難中都學習倚靠祢，活出愛與盼望。阿們。"},
{title:"在主裡領受安穩",ref:"羅馬書 5:3",verse:"不但如此，就是在患難中也是歡歡喜喜的；因為知道患難生忍耐，",prayer:"主耶穌，求祢更新我的心，使我在疲倦時重新得力，在迷惘時看見方向，知道祢一直與我同行。阿們。"},
{title:"在主裡領受盼望",ref:"羅馬書 8:1",verse:"如今，那些在基督耶穌裏的就不定罪了。",prayer:"慈愛的天父，求祢看顧我和所愛的人，賜下健康、和睦與日用所需，也使我們成為別人的祝福。阿們。"},
{title:"在主裡領受勇氣",ref:"羅馬書 8:31",verse:"既是這樣，還有甚麼說的呢？上帝若幫助我們，誰能敵擋我們呢？",prayer:"主啊，求祢賜我謙卑受教的心，在今天的選擇中尋求祢的心意，並勇敢行出祢喜悅的道路。阿們。"},
{title:"在主裡領受喜樂",ref:"羅馬書 8:39",verse:"是高處的，是低處的，是別的受造之物，都不能叫我們與上帝的愛隔絕；這愛是在我們的主基督耶穌裏的。",prayer:"親愛的神，感謝祢不離不棄的愛。求祢幫助我放下懼怕，以感恩的心迎接新的開始。阿們。"},
{title:"在主裡領受引導",ref:"羅馬書 12:12",verse:"在指望中要喜樂；在患難中要忍耐；禱告要恆切。",prayer:"親愛的天父，求祢用這段話堅固我的心。求祢帶領我今天的腳步，在每件事上經歷祢的同在。阿們。"},

{title:"在主裡領受平安",ref:"哥林多後書 4:16",verse:"所以，我們不喪膽。外體雖然毀壞，內心卻一天新似一天。",prayer:"親愛的主，求祢安慰我心中的憂慮，幫助我把重擔交給祢，並以祢所賜的平安保守我。阿們。"},
{title:"在主裡領受信心",ref:"哥林多後書 12:9",verse:"他對我說：「我的恩典夠你用的，因為我的能力是在人的軟弱上顯得完全。」所以，我更喜歡誇自己的軟弱，好叫基督的能力覆庇我。",prayer:"天父，求祢幫助我把祢的話藏在心裡，在順境與困難中都學習倚靠祢，活出愛與盼望。阿們。"},
{title:"在主裡領受扶持",ref:"以弗所書 2:10",verse:"我們原是他的工作，在基督耶穌裏造成的，為要叫我們行善，就是上帝所預備叫我們行的。",prayer:"慈愛的天父，求祢看顧我和所愛的人，賜下健康、和睦與日用所需，也使我們成為別人的祝福。阿們。"},

{title:"在主裡領受力量",ref:"腓立比書 1:6",verse:"我深信那在你們心裏動了善工的，必成全這工，直到耶穌基督的日子。",prayer:"親愛的神，感謝祢不離不棄的愛。求祢幫助我放下懼怕，以感恩的心迎接新的開始。阿們。"},
{title:"在主裡領受安穩",ref:"腓立比書 2:13",verse:"因為你們立志行事都是上帝在你們心裏運行，為要成就他的美意。",prayer:"親愛的天父，求祢用這段話堅固我的心。求祢帶領我今天的腳步，在每件事上經歷祢的同在。阿們。"},

{title:'在苦難中仍可放心',ref:'約翰福音 16:33',verse:'我將這些事告訴你們，是要叫你們在我裡面有平安。在世上，你們有苦難；但你們可以放心，我已經勝了世界。',focus:'在主裡面有平安和盼望',challenge:'遭遇挫折或艱難',practice:'放心倚靠已經得勝的主'},
{title:'因主幫助而有勇氣',ref:'羅馬書 8:31',verse:'既是這樣，還有什麼說的呢？　神若幫助我們，誰能敵擋我們呢？',focus:'祢是幫助我的神',challenge:'感到被困難壓倒',practice:'靠著祢所賜的勇氣回應'},
{title:'在盼望中喜樂',ref:'羅馬書 12:12',verse:'在指望中要喜樂，在患難中要忍耐，禱告要恆切。',focus:'在盼望中仍有喜樂',challenge:'等待的過程漫長',practice:'持續禱告並耐心前行'},
{title:'試探中有出路',ref:'哥林多前書 10:13',verse:'你們所遇見的試探，無非是人所能受的。　神是信實的，必不叫你們受試探過於所能受的；在受試探的時候，總要給你們開一條出路，叫你們能忍受得住。',focus:'祢信實地為我預備出路',challenge:'面對誘惑或難以承受的事',practice:'尋找祢所開的道路並求助'},
{title:'恩典在軟弱中夠用',ref:'哥林多後書 12:9',verse:'他對我說：「我的恩典夠你用的，因為我的能力是在人的軟弱上顯得完全。」所以，我更喜歡誇自己的軟弱，好叫基督的能力覆庇我。',focus:'祢的恩典在軟弱中夠用',challenge:'覺得自己能力不足',practice:'坦然承認需要並倚靠祢'},
{title:'行善不灰心',ref:'加拉太書 6:9',verse:'我們行善，不可喪志；若不灰心，到了時候就要收成。',focus:'忠心行善必有合宜的收成',challenge:'付出很久仍看不見結果',practice:'繼續以愛心做今天能做的事'},
{title:'靠主所賜的力量',ref:'腓立比書 4:13',verse:'我靠著那加給我力量的，凡事都能做。',focus:'祢賜我力量面對今天',challenge:'覺得任務超出能力',practice:'依靠祢一步一步完成責任'},
{title:'知足並信靠主',ref:'希伯來書 13:5–6',verse:'你們存心不可貪愛錢財，要以自己所有的為足；因為主曾說：「我總不撇下你，也不丟棄你。」所以我們可以放膽說：「主是幫助我的，我必不懼怕；人能把我怎麼樣呢？」',focus:'主不撇下我，也不丟棄我',challenge:'為未來的供應感到焦慮',practice:'感謝已有的恩典並勇敢信靠主'},
{title:'把憂慮交給顧念我的神',ref:'彼得前書 5:7',verse:'你們要將一切的憂慮卸給　神，因為他顧念你們。',focus:'祢顧念我每一個需要',challenge:'心中堆積許多擔憂',practice:'把每一件憂慮交託給祢'},
{title:'盼望眼淚被擦去',ref:'啟示錄 21:4',verse:'神要擦去他們一切的眼淚；不再有死亡，也不再有悲哀、哭號、疼痛，因為以前的事都過去了。',focus:'祢應許有完全更新的盼望',challenge:'經歷失落或悲傷',practice:'在眼前的眼淚中仍仰望永恆'},
{title:'把主常擺在面前',ref:'詩篇 16:8',verse:'我將耶和華常擺在我面前，因他在我右邊，我便不致搖動。',focus:'祢一直在我身旁扶持我',challenge:'感到搖動或缺乏把握',practice:'常常思想祢的同在'}
];
const prayerModes=[
{s:'同行',make:s=>`親愛的天父，求祢讓我今天深深領受「${s.focus}」。當我${s.challenge}時，求祢堅固我的信心，提醒我祢的應許不改變。阿們。`},
{s:'感恩',make:s=>`主耶穌，謝謝祢藉著${s.ref}安慰和提醒我。求祢幫助我${s.practice}，使我的言語與行動都見證祢的恩典。阿們。`},
{s:'交託',make:s=>`親愛的主，我把${s.challenge}交在祢手中。求祢引導我${s.practice}，並賜我平安、忍耐和盼望，按祢的心意走今天的路。阿們。`}
];
blessings.push(...supplementalScriptures.flatMap(s=>prayerModes.map((m,i)=>({title:`${s.title}・${m.s}`,ref:s.ref,verse:s.verse,prayer:m.make(s)}))));const zone=document.getElementById('scratchZone'),canvas=document.getElementById('scratch'),ctx=canvas.getContext('2d',{willReadFrequently:true}),titleEl=document.getElementById('blessingTitle'),refEl=document.getElementById('verseRef'),verseEl=document.getElementById('verseText'),prayerEl=document.getElementById('prayerText'),numEl=document.getElementById('cardNumber'),statusEl=document.getElementById('status');let current=-1,currentScene=0,drawing=false,lastPoint=null,checkTimer=0;
function chooseBlessing(){let next;do{next=Math.floor(Math.random()*blessings.length)}while(blessings.length>1&&next===current);current=next;currentScene=Math.floor(Math.random()*storyScenes.length);const b=blessings[current];titleEl.textContent=b.title;refEl.textContent=b.ref;verseEl.textContent=b.verse;prayerEl.textContent=b.prayer;numEl.textContent=String(current+1).padStart(2,'0')}
const storyScenes=[
{title:'挪亞方舟',ref:'創世記 6–9 章',draw(){sky('#6db8bc','#f5d9a5');circle(335,72,30,'#ffe9a6');ctx.strokeStyle='rgba(255,240,194,.7)';ctx.lineWidth=5;for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(210,144,95+i*9,Math.PI*1.08,Math.PI*1.92);ctx.stroke()}wave(197,14,'#367d83');wave(221,12,'#286b73');poly([[73,174],[346,174],[324,212],[113,212]],'#79543d');rect(119,151,187,24,'#a97c4d');poly([[178,150],[178,125],[245,125],[267,151]],'#d4b273');for(let x=191;x<254;x+=21)rect(x,133,9,10,'#4c6658');}},
{title:'摩西帶領出埃及',ref:'出埃及記 14 章',draw(){sky('#f3b478','#f8e2b7');circle(210,76,32,'#fff0bc');poly([[0,92],[58,104],[68,174],[0,199]],'#388f9a');poly([[0,92],[42,106],[52,167],[0,184]],'#58aab0');poly([[420,92],[362,104],[352,174],[420,199]],'#388f9a');poly([[420,92],[378,106],[368,167],[420,184]],'#58aab0');for(let y=112;y<171;y+=17){waveAtSide(10,y,52);waveAtSide(368,y,42)}poly([[112,270],[151,173],[270,173],[315,270]],'#d8bb86');person(210,150,.75,'#744c47');line(229,153,245,109,'#d7bd7b',3);}},
{title:'大衛迎戰歌利亞',ref:'撒母耳記上 17 章',draw(){sky('#86bdc3','#f2d28f');circle(333,68,27,'#ffe7a3');poly([[0,183],[88,129],[167,181],[259,118],[420,183],[420,270],[0,270]],'#5d8a67');poly([[0,218],[116,164],[202,213],[301,159],[420,215],[420,270],[0,270]],'#355f4b');person(112,177,.63,'#d8bd78');person(291,136,1.02,'#635258');line(294,153,329,191,'#d0b16a',4);circle(140,174,4,'#d9be7d');}},
{title:'伯利恆的星光',ref:'馬太福音 2 章',draw(){sky('#182f57','#735c7a');for(const [x,y,r] of [[50,48,2],[105,80,2],[321,55,2],[365,103,2],[85,132,1.7],[344,149,1.5]])circle(x,y,r,'#fff2c7');star(210,62,25,'#ffe595');poly([[0,214],[85,181],[158,215],[265,176],[420,216],[420,270],[0,270]],'#293e54');poly([[132,224],[140,176],[280,176],[291,224]],'#705644');poly([[119,179],[210,132],[301,179]],'#392f37');rect(177,192,67,33,'#d5bd86');circle(210,192,8,'#ffe9aa');person(165,181,.48,'#896b58');person(253,181,.48,'#56617a');}},
{title:'耶穌平靜風浪',ref:'馬可福音 4 章',draw(){sky('#253f63','#526f86');for(const [x,y,s] of [[66,81,1],[153,55,.8],[328,88,1.1]])cloud(x,y,s,'#415971');wave(158,19,'#37778a');wave(190,18,'#28657a');wave(223,14,'#1e566c');poly([[93,180],[329,180],[292,210],[130,210]],'#795843');poly([[157,179],[185,144],[219,144],[249,179]],'#e0c998');person(202,119,.68,'#d4c394');}},
{title:'好撒馬利亞人',ref:'路加福音 10 章',draw(){sky('#e8b77e','#f2ddb2');circle(342,69,28,'#ffedb7');poly([[0,183],[109,125],[193,185],[300,115],[420,170],[420,270],[0,270]],'#bd9563');poly([[0,216],[100,178],[213,216],[316,168],[420,207],[420,270],[0,270]],'#8b7958');line(22,252,398,196,'#e5c991',21);person(177,182,.58,'#55756b');person(252,191,.64,'#a85c45');circle(203,203,5,'#d8bd87');}}
];
function sky(top,bottom){const g=ctx.createLinearGradient(0,0,0,270);g.addColorStop(0,top);g.addColorStop(1,bottom);ctx.fillStyle=g;ctx.fillRect(0,0,420,270)}
function circle(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}
function poly(points,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fill()}
function line(x1,y1,x2,y2,color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function wave(y,amp,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,y);for(let x=0;x<=420;x+=70)ctx.quadraticCurveTo(x+35,y-amp,x+70,y);ctx.lineTo(420,270);ctx.lineTo(0,270);ctx.closePath();ctx.fill()}
function waveAtSide(x,y,w){ctx.strokeStyle='rgba(217,242,231,.65)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+w*.5,y+6,x+w,y);ctx.stroke()}
function star(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.3:r;const px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath();ctx.fill();ctx.shadowColor=color;ctx.shadowBlur=16;circle(x,y,2.5,color);ctx.shadowBlur=0}
function cloud(x,y,s,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,18*s,0,Math.PI*2);ctx.arc(x+19*s,y-10*s,23*s,0,Math.PI*2);ctx.arc(x+43*s,y,17*s,0,Math.PI*2);ctx.rect(x-1*s,y,46*s,17*s);ctx.fill()}
function person(x,y,s,robe){circle(x,y-14*s,8*s,'#d2a77c');poly([[x-9*s,y-6*s],[x+9*s,y-6*s],[x+15*s,y+35*s],[x-15*s,y+35*s]],robe)}
function drawStoryScene(index,w,h){const scene=storyScenes[index%storyScenes.length];ctx.save();ctx.globalCompositeOperation='source-over';const sceneScale=Math.min(w/420,h/270);ctx.translate((w-420*sceneScale)/2,(h-270*sceneScale)/2);ctx.scale(sceneScale,sceneScale);scene.draw();const shade=ctx.createLinearGradient(0,0,0,270);shade.addColorStop(0,'rgba(18,38,47,.22)');shade.addColorStop(.35,'rgba(18,38,47,0)');shade.addColorStop(1,'rgba(13,37,37,.22)');ctx.fillStyle=shade;ctx.fillRect(0,0,420,270);ctx.restore()}function paintCover(){const rect=zone.getBoundingClientRect(),dpr=Math.max(1,window.devicePixelRatio||1);canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);canvas.style.width=rect.width+'px';canvas.style.height=rect.height+'px';ctx.setTransform(dpr,0,0,dpr,0,0);const w=rect.width,h=rect.height;const g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,'#21483c');g.addColorStop(.52,'#315d4d');g.addColorStop(1,'#173c32');ctx.globalCompositeOperation='source-over';ctx.fillStyle=g;ctx.fillRect(0,0,w,h);drawStoryScene(currentScene,w,h);ctx.strokeStyle='rgba(226,207,154,.48)';ctx.lineWidth=1;ctx.strokeRect(11,11,w-22,h-22);ctx.fillStyle='rgba(242,229,190,.10)';for(let y=25;y<h;y+=23){for(let x=25;x<w;x+=23){ctx.beginPath();ctx.arc(x,y,1,0,Math.PI*2);ctx.fill()}}ctx.globalCompositeOperation='destination-out';zone.classList.remove('is-revealed')}
function pointFromEvent(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function scratchLine(a,b){ctx.globalCompositeOperation='destination-out';ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=38;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
function fitBlessing(){const box=document.querySelector('.blessing-content');box.classList.remove('compact','ultra-compact');if(box.scrollHeight>box.clientHeight)box.classList.add('compact');if(box.scrollHeight>box.clientHeight)box.classList.add('ultra-compact')}function revealAll(){ctx.clearRect(0,0,canvas.width,canvas.height);zone.classList.add('is-revealed');requestAnimationFrame(fitBlessing);statusEl.textContent='祝福已揭開，願主的平安與你同在。'}
function checkErased(){if(zone.classList.contains('is-revealed'))return;const w=canvas.width,h=canvas.height;try{const data=ctx.getImageData(0,0,w,h).data;let erased=0,total=0;const step=24;for(let y=0;y<h;y+=step){for(let x=0;x<w;x+=step){const a=data[(y*w+x)*4+3];if(a<60)erased++;total++}}if(erased/total>.42)revealAll()}catch(_){}}
function beginScratch(e){if(zone.classList.contains('is-revealed'))return;if(e.cancelable)e.preventDefault();drawing=true;if(e.pointerId!==undefined&&canvas.setPointerCapture){try{canvas.setPointerCapture(e.pointerId)}catch(_){}}lastPoint=pointFromEvent(e);scratchLine(lastPoint,lastPoint);statusEl.textContent='繼續刮開，祝福快要顯現了。'}function moveScratch(e){if(!drawing||!lastPoint)return;if(e.cancelable)e.preventDefault();const p=pointFromEvent(e);scratchLine(lastPoint,p);lastPoint=p;if(!checkTimer)checkTimer=requestAnimationFrame(()=>{checkTimer=0;checkErased()})}function stopDrawing(){drawing=false;lastPoint=null;if(checkTimer){cancelAnimationFrame(checkTimer);checkTimer=0}checkErased()}if(window.PointerEvent){canvas.addEventListener('pointerdown',beginScratch,{passive:false});canvas.addEventListener('pointermove',moveScratch,{passive:false});canvas.addEventListener('pointerup',stopDrawing);canvas.addEventListener('pointercancel',stopDrawing);canvas.addEventListener('lostpointercapture',stopDrawing)}else{canvas.addEventListener('touchstart',e=>{if(e.changedTouches.length)beginScratch(e.changedTouches[0])},{passive:false});canvas.addEventListener('touchmove',e=>{if(e.touches.length)moveScratch(e.touches[0])},{passive:false});canvas.addEventListener('touchend',stopDrawing,{passive:false});canvas.addEventListener('touchcancel',stopDrawing,{passive:false});canvas.addEventListener('mousedown',beginScratch);window.addEventListener('mousemove',moveScratch);window.addEventListener('mouseup',stopDrawing)}
document.getElementById('revealBtn').addEventListener('click',revealAll);document.getElementById('againBtn').addEventListener('click',()=>{chooseBlessing();paintCover();statusEl.textContent='新的一份祝福已為你預備。'});chooseBlessing();paintCover();let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(!zone.classList.contains('is-revealed'))paintCover();else fitBlessing()},100)});
</script>
